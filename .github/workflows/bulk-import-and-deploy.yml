name: Bulk Import Games & Deploy

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'List of Boxscore URLs (one per line, optionally "URL | Memory Note")'
        required: true
        type: string
      default_notes:
        description: 'Default note for games without individual notes (optional)'
        required: false
        type: string
      delay_ms:
        description: 'Delay between scrape requests in milliseconds (default: 1500)'
        required: false
        default: '1500'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  import-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Bulk Importer
        env:
          URLS_LIST: ${{ github.event.inputs.urls }}
          GAME_NOTES: ${{ github.event.inputs.default_notes }}
        run: |
          npx tsx scripts/import-games.ts --delay "${{ github.event.inputs.delay_ms }}"

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git diff --staged --quiet || (git commit -m "data: bulk import games via CourtPass action [skip ci]" && git push)

      - name: Build Vite React App
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
