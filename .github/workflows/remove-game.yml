name: Remove Game & Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Game ID (e.g. nba-202411110NOP) or Boxscore URL to remove'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  remove-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Remove Game
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          npx tsx scripts/delete-game.ts --target "${{ github.event.inputs.target }}"

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json public/data/games.json
          git diff --staged --quiet || (git commit -m "data: remove game '${{ github.event.inputs.target }}' [skip ci]" && git push)

      - name: Build Vite React App
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
