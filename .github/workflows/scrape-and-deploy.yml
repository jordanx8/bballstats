name: Scrape Game & Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Basketball-Reference or Sports-Reference Boxscore URL'
        required: true
        type: string
      notes:
        description: 'Personal memory or notes (optional)'
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and committing data
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Scrape Game Boxscore
        env:
          GAME_URL: ${{ github.event.inputs.url }}
          GAME_NOTES: ${{ github.event.inputs.notes }}
        run: |
          npx tsx scripts/scrape-game.ts --url "${{ github.event.inputs.url }}" --notes "${{ github.event.inputs.notes }}"

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json public/data/games.json
          git diff --staged --quiet || (git commit -m "data: log game via CourtPass action [skip ci]" && git push)

      - name: Build Vite React App
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
